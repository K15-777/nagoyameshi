<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <div th:replace="~{fragment :: meta}"></div>
    <div th:replace="~{fragment :: styles}"></div>
    <title>有料プラン解約</title>
</head>
<body>
    <div class="nagoyameshi-wrapper">
        <div th:replace="~{fragment :: header}"></div>

        <main>
            <div class="container pb-5 nagoyameshi-container">
                <div class="row justify-content-center">
                    <div class="col-xl-5 col-lg-6 col-md-8">
                        <nav class="my-3" style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb">
                            <ol class="breadcrumb mb-0">
                                <li class="breadcrumb-item"><a th:href="@{/}">ホーム</a></li>
                                <li class="breadcrumb-item"><a th:href="@{/user}">会員情報</a></li>
                                <li class="breadcrumb-item active" aria-current="page">有料プラン解約</li>
                            </ol>
                        </nav>

                        <h1 class="mb-4 text-center">有料プラン解約</h1>

                        <div class="card mb-4 border-danger">
                            <div class="card-body">
                                <p class="card-text text-danger fw-bold mb-2">解約前の注意事項</p>
                                <p class="card-text text-muted small mb-0">
                                    解約手続きを完了すると、以下の機能が利用できなくなります。
                                </p>
                                <ul class="text-muted small mt-2 mb-0">
                                    <li>店舗の予約機能</li>
                                    <li>お気に入り一覧の閲覧・登録</li>
                                    <li>レビューの投稿</li>
                                </ul>
                            </div>
                        </div>

                        <form method="post" th:action="@{/subscription/delete}">
                            <div class="d-flex justify-content-between">
                                <a th:href="@{/user}" class="btn btn-outline-secondary w-50 me-2">キャンセル</a>
                                <button type="submit" class="btn btn-danger w-50 ms-2">解約する</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>

        <div th:replace="~{fragment :: footer}"></div>
    </div>

    <div th:replace="~{fragment :: scripts}"></div>
</body>
</html>
