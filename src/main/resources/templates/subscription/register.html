<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <div th:replace="~{fragment :: meta}"></div>
    <div th:replace="~{fragment :: styles}"></div>
    <title>有料プラン登録</title>
</head>
<body>
    <div class="nagoyameshi-wrapper">
        <div th:replace="~{fragment :: header}"></div>

        <main>
            <div class="container pb-5 nagoyameshi-container">
                <div class="row justify-content-center">
                    <div class="col-xl-5 col-lg-6 col-md-8">
                        <nav class="my-3" style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb">
                            <ol class="breadcrumb mb-0">
                                <li class="breadcrumb-item"><a th:href="@{/}">ホーム</a></li>
                                <li class="breadcrumb-item"><a th:href="@{/user}">会員情報</a></li>
                                <li class="breadcrumb-item active" aria-current="page">有料プラン登録</li>
                            </ol>
                        </nav>

                        <h1 class="mb-4 text-center">有料プラン登録</h1>

                        <div class="card mb-4">
                            <div class="card-body">
                                <h5 class="card-title fw-bold mb-3">有料会員特典</h5>
                                <ul class="mb-0">
                                    <li>店舗の予約が可能</li>
                                    <li>お気に入り店舗の保存</li>
                                    <li>レビューの投稿・閲覧</li>
                                </ul>
                            </div>
                        </div>

                        <form method="post" th:action="@{/subscription/create}">
                            <button type="submit" class="btn text-white shadow-sm w-100 nagoyameshi-btn">
                                月額300円で登録する
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </main>

        <div th:replace="~{fragment :: footer}"></div>
    </div>

    <div th:replace="~{fragment :: scripts}"></div>
</body>
</html>
