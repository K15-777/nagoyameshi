<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <div th:replace="~{fragment :: meta}"></div>
    <div th:replace="~{fragment :: styles}"></div>
    <title>パスワード再設定</title>
</head>
<body>
    <div class="nagoyameshi-wrapper">
        <div th:replace="~{fragment :: header}"></div>

        <main>
            <div class="container pt-4 pb-5 nagoyameshi-container">
                <div class="row justify-content-center">
                    <div class="col-xl-4 col-lg-5 col-md-6 col-sm-8">
                        <h1 class="mb-4 text-center">パスワード再設定</h1>

                        <form method="post" th:action="@{/reset-password}" th:object="${resetPasswordForm}">
                            <!-- メールアドレス -->
                            <div class="form-group mb-3">
                                <label for="email" class="form-label text-md-left fw-bold">メールアドレス</label>
                                <div th:if="${#fields.hasErrors('email')}" class="text-danger small mb-2" th:errors="*{email}"></div>
                                <input type="email" class="form-control" th:field="*{email}" autocomplete="email" placeholder="example@example.com">
                            </div>

                            <!-- 新しいパスワード -->
                            <div class="form-group mb-3">
                                <label for="password" class="form-label text-md-left fw-bold">新しいパスワード</label>
                                <div th:if="${#fields.hasErrors('password')}" class="text-danger small mb-2" th:errors="*{password}"></div>
                                <input type="password" class="form-control" th:field="*{password}" autocomplete="new-password" placeholder="8文字以上">
                            </div>

                            <!-- 確認用パスワード -->
                            <div class="form-group mb-4">
                                <label for="passwordConfirmation" class="form-label text-md-left fw-bold">パスワード（確認用）</label>
                                <div th:if="${#fields.hasErrors('passwordConfirmation')}" class="text-danger small mb-2" th:errors="*{passwordConfirmation}"></div>
                                <input type="password" class="form-control" th:field="*{passwordConfirmation}" autocomplete="new-password">
                            </div>

                            <div class="form-group d-flex justify-content-center my-4">
                                <button type="submit" class="btn text-white shadow-sm w-100 nagoyameshi-btn">再設定する</button>
                            </div>
                        </form>

                        <div class="text-center">
                            <a th:href="@{/login}">ログイン画面に戻る</a>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <div th:replace="~{fragment :: footer}"></div>
    </div>

    <div th:replace="~{fragment :: scripts}"></div>
</body>
</html>
